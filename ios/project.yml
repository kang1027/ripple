name: Ripple
options:
  bundleIdPrefix: com.kdh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: GGR9HG6DB8
packages:
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: "2.20.0"
targets:
  Ripple:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Ripple
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdh.ripple
        INFOPLIST_FILE: Ripple/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Ripple/Ripple.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: KakaoSDK
        product: KakaoSDKCommon
      - package: KakaoSDK
        product: KakaoSDKAuth
      - package: KakaoSDK
        product: KakaoSDKUser
