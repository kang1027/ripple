services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ripple:ripple@postgres:5432/ripple
      REDIS_URL: redis://redis:6379/0
      RUN_WORKER_INLINE: "false"
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"
    depends_on: [postgres, redis]
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ripple:ripple@postgres:5432/ripple
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ripple
      POSTGRES_PASSWORD: ripple
      POSTGRES_DB: ripple
    volumes:
      - pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
volumes:
  pg:
  media:
